name: Godot Native QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip             https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          ./Godot_v4.4.1-stable_linux.x86_64 --version
      - name: Import project and parse scripts
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path game --quit
      - name: Boot production main scene
        run: timeout 20s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --quit-after 1
      - name: Run core native suite
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_headless.gd
      - name: Run P3 regression native suite
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_p1_headless.gd
      - name: Run system-contract native suite
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_system_contracts.gd
      - name: Run world-runtime native suite
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_world_runtime.gd
      - name: Run eight-region scene native suite
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_region_scenes.gd
      - name: Run spatial-runtime native suite
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_spatial_runtime.gd
      - name: Run world-interaction native suite
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_world_interactions.gd
      - name: Run route-geometry native suite
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_route_geometry.gd
      - name: Run physical-movement native suite
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_physics_routes.gd
      - name: Run first-eight physical story E2E
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_first_eight_e2e.gd
      - name: Run first-eight tournament and save E2E
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_first_eight_poker.gd
      - name: Run main 09-16 physical story E2E
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_main_09_16_e2e.gd
      - name: Run main 09-16 tournament and save E2E
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_main_09_16_poker.gd
      - name: Run main 17-24 physical story E2E
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_main_17_24_e2e.gd
      - name: Run main 17-24 tournament and qualification E2E
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_main_17_24_poker.gd
      - name: Run main 25-32 physical story E2E
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_main_25_32_e2e.gd
      - name: Run main 25-32 tournament and station-route E2E
        run: timeout 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests_main_25_32_poker.gd
