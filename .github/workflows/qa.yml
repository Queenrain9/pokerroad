name: Core QA

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      exhaustive:
        description: Run exact 2,598,960 five-card classification
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  python-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: analysis/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r analysis/requirements-dev.txt
      - name: Run structural, source-integrity, and data QA
        run: python analysis/run_qa.py
      - name: Run exhaustive poker classifier only when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.exhaustive }}
        run: python analysis/run_qa.py --exhaustive
