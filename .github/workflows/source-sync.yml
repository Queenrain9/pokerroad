name: Verify Notion v4.2 scene source

on:
  push:
    branches: [main]
    paths:
      - 'source/original_notion_v4_2/*.md'
      - 'tools/generate_manifest.py'
      - 'tools/generate_event_catalog.py'
      - 'tools/build_traversal_graph.py'
      - 'tools/import_original_scenes.py'
      - 'docs/NOTION_SOURCE_REMOTE_AUDIT.json'
      - 'game/data/world_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify captured source without overwriting gameplay state
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          audit=json.loads(Path('docs/NOTION_SOURCE_REMOTE_AUDIT.json').read_text(encoding='utf8'))
          manifest=json.loads(Path('game/data/world_manifest.json').read_text(encoding='utf8'))
          assert len(manifest['regions'])==8 and len(manifest['scenes'])==88
          assert all(s['source_import_status']=='IMPORTED' for s in manifest['scenes'])
          for region in audit['regions']:
              name=f"15_{region['id']}.md"
              raw=(Path('source/original_notion_v4_2')/name).read_bytes()
              assert raw==(Path('game/data/source_pages_verbatim')/name).read_bytes()
              value=2166136261
              for byte in raw:
                  value=((value^byte)*16777619)&0xffffffff
              assert len(raw)==region['source_utf8_bytes'] and f'{value:08x}'==region['fnv32']
          for scene in manifest['scenes']:
              source=json.loads((Path('game/data/original_scenes')/f"{scene['id']}.json").read_text(encoding='utf8'))
              assert source['scene_id']==scene['id']
              assert hashlib.sha256(source['verbatim_source_markdown'].encode()).hexdigest()==source['source_section_sha256']
          print('SOURCE_VERIFIED: 8 pages / 88 scenes')
          PY
